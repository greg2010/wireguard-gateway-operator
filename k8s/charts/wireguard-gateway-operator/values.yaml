# Required: operator.image and link.image. Other settings have defaults.


operator:
  image:
    repository: ""
    tag: ""
  pullPolicy: IfNotPresent
  # Leader election permits warm-standby replicas while retaining a single active replica.
  replicas: 1
  # Single-active-replica reconciliation via a Lease. Maps GATEWAY_OPERATOR_LEADER_ELECTION.
  leaderElection: true
  # Prometheus metrics bind address. "0" disables. Maps GATEWAY_OPERATOR_METRICS_ADDR.
  metricsAddr: ":8080"
  # healthz/readyz bind address; the probes target it. Maps GATEWAY_OPERATOR_HEALTH_ADDR.
  healthAddr: ":8081"
  # Empty derives wgnet-<release>; set only to pin a VPC name. Maps GATEWAY_SHARED_NETWORK_NAME.
  sharedNetworkName: ""
  # zap level name (debug, info, warn, error). Maps LOG_LEVEL.
  logLevel: info
  # Emit structured JSON logs (zap production encoder). Maps PROD_LOG_FORMAT.
  jsonLog: true
  # Enable GCP OS Login on gateway VMs (SSH access governed by IAM). Maps GATEWAY_ENABLE_OSLOGIN.
  enableOsLogin: true
  # Set a distinct config to isolate credentials/project. Maps GATEWAY_PROVIDER_CONFIG_NAME.
  providerConfigName: default
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

link:
  # Stamped onto each link Deployment. Maps GATEWAY_LINK_IMAGE.
  image:
    repository: ""
    tag: ""
  # imagePullPolicy for the link container. Maps GATEWAY_LINK_IMAGE_PULL_POLICY.
  pullPolicy: IfNotPresent

gcp:
  # Membership discovery reads this existing Secret.
  # Maps GATEWAY_GCP_CREDENTIALS_SECRET/GATEWAY_GCP_CREDENTIALS_KEY.
  credentialsSecret:
    namespace: crossplane-system
    name: gcp-creds
    key: credentials.json
  # Requeue floor for load-balanced Gateway discovery. Maps GATEWAY_GCP_DISCOVERY_INTERVAL.
  discoveryInterval: "30s"
  # Bound on periodic instances.get refresh. Maps GATEWAY_GCP_ADDRESS_REFRESH_INTERVAL.
  addressRefreshInterval: "10m"
