---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: gateways.wgnet.dev
spec:
  group: wgnet.dev
  names:
    kind: Gateway
    listKind: GatewayList
    plural: gateways
    shortNames:
    - gw
    singular: gateway
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.address
      name: Address
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .spec.trafficPolicy
      name: Policy
      type: string
    - jsonPath: .status.link.activeNode
      name: Node
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              dnsHostnames:
                description: DNSHostnames are FQDNs the operator publishes via a DNSEndpoint.
                items:
                  type: string
                type: array
              forwards:
                description: Forwards are the public ports DNAT'd through the gateway
                  to in-cluster pods.
                items:
                  properties:
                    namespace:
                      description: |-
                        Namespace of the target Service, defaulting to the Gateway's namespace. Another
                        namespace must carry the wgnet.dev/allow-gateway-ingress=true label.
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    port:
                      description: |-
                        Port is the public port opened on the gateway VM and DNAT'd through the
                        tunnel.
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    protocol:
                      description: Protocol is an L4 transport protocol for a forwarded
                        port.
                      enum:
                      - TCP
                      - UDP
                      type: string
                    service:
                      description: |-
                        Service is the bare in-cluster Service name, constrained to a single
                        DNS-1035 label so a dotted FQDN cannot bypass the Namespace gate.
                      minLength: 1
                      pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    targetPort:
                      description: TargetPort is the port on Service; it defaults
                        to Port when unset.
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                  required:
                  - port
                  - protocol
                  - service
                  type: object
                maxItems: 64
                type: array
              gcp:
                properties:
                  address:
                    default: {}
                    description: |-
                      Address selects the gateway VM's public ingress address. Every value has a
                      default, so the block may be omitted.
                    properties:
                      external:
                        description: |-
                          External identifies the pre-existing regional external address to bind. It must
                          live in spec.gcp.projectID and spec.gcp.region.
                        properties:
                          ip:
                            description: IP is the literal IPv4 address of a reserved
                              regional external address.
                            pattern: ^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$
                            type: string
                          name:
                            description: Name is the GCP regional Address resource
                              name.
                            minLength: 1
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: spec.gcp.address.external must set exactly one
                            of name and ip
                          rule: has(self.name) != has(self.ip)
                      type:
                        default: Reserved
                        description: |-
                          Ephemeral takes whatever address the instance is assigned; Reserved allocates a static regional
                          address alongside the VM; External binds an address reserved outside the operator.
                        enum:
                        - Ephemeral
                        - Reserved
                        - External
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: spec.gcp.address.external is required when type is
                        External and forbidden otherwise
                      rule: (has(self.type) && self.type == 'External') == has(self.external)
                  diskSizeGB:
                    default: 20
                    description: DiskSizeGB is the gateway VM boot disk size in GB.
                    format: int32
                    minimum: 1
                    type: integer
                  image:
                    default: projects/kinvolk-public/global/images/family/flatcar-stable
                    description: |-
                      Image is the gateway VM boot image. The gateway boots Flatcar because its
                      userData is Flatcar Ignition; this defaults to the GCP Flatcar stable family.
                    type: string
                  loadBalancer:
                    description: |-
                      LoadBalancer opts a Gateway into the regional-MIG-behind-passthrough-NLB path.
                      Absent keeps the single-Instance path. Presence is fixed at creation.
                    properties:
                      sessionAffinity:
                        default: NONE
                        description: SessionAffinity is the regional backend service's
                          affinity mode.
                        enum:
                        - NONE
                        - CLIENT_IP_PORT_PROTO
                        - CLIENT_IP_PROTO
                        - CLIENT_IP
                        type: string
                    type: object
                  machineType:
                    default: e2-small
                    type: string
                  projectID:
                    description: |-
                      ProjectID is the GCP project owning the gateway VM and its Secret Manager secret;
                      the boot keyfetch resolves the secret URL through it.
                    minLength: 1
                    type: string
                  region:
                    maxLength: 63
                    minLength: 1
                    type: string
                  replicas:
                    default: 1
                    description: |-
                      Replicas is the desired member count, at most the usable hosts of Wireguard.Subnet less
                      the link's own address, and never more than 256.
                    format: int32
                    minimum: 1
                    type: integer
                  spot:
                    default: false
                    description: Spot runs the gateway VM as a preemptible spot instance.
                    type: boolean
                  zone:
                    maxLength: 63
                    minLength: 1
                    type: string
                  zones:
                    description: |-
                      Zones spreads a load-balanced Gateway's regional MIG. Absent means the effective
                      list [Zone]; the effective list is computed at reconcile, never persisted.
                    items:
                      maxLength: 63
                      minLength: 1
                      type: string
                    maxItems: 8
                    type: array
                    x-kubernetes-list-type: set
                required:
                - projectID
                - region
                - zone
                type: object
                x-kubernetes-validations:
                - message: spec.gcp.zones entries must be inside spec.gcp.region
                  rule: '!has(self.zones) || self.zones.all(z, z.startsWith(self.region
                    + ''-''))'
                - message: without spec.gcp.loadBalancer, replicas must be 1 and zones,
                    if set, must equal [zone]
                  rule: has(self.loadBalancer) || (self.replicas <= 1 && (!has(self.zones)
                    || (self.zones.size() == 1 && self.zones[0] == self.zone)))
                - message: spec.gcp.loadBalancer presence is immutable
                  rule: has(self.loadBalancer) == has(oldSelf.loadBalancer)
                - message: a load-balanced Gateway's effective zone set is immutable
                  rule: '!has(self.loadBalancer) || ((has(self.zones) ? self.zones
                    : [self.zone]).size() == (has(oldSelf.zones) ? oldSelf.zones :
                    [oldSelf.zone]).size() && (has(self.zones) ? self.zones : [self.zone]).all(z,
                    z in (has(oldSelf.zones) ? oldSelf.zones : [oldSelf.zone])))'
                - message: spec.gcp.diskSizeGB is immutable on a single-instance Gateway
                  rule: has(self.loadBalancer) || self.diskSizeGB == oldSelf.diskSizeGB
              link:
                default: {}
                description: |-
                  Link configures the in-cluster link workload: a Deployment in Cluster mode, a
                  DaemonSet in Local mode. Every value has a default, so the block may be omitted.
                properties:
                  healthPort:
                    description: |-
                      HealthPort is the port the cloud health check probes on the VM and the link DNATs to
                      the responder. Cluster only; 27000 when unset. A TCP forward may not use it. Mutable.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: |-
                      NodeSelector is applied to the link pod template: the Deployment's in Cluster
                      mode, the DaemonSet's in Local mode.
                    type: object
                  replicas:
                    default: 1
                    description: |-
                      Replicas is the number of link pods. Values >1 enable hot-standby
                      failover and safe rolling updates via leader election.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              provider:
                default: gcp
                description: |-
                  Provider selects the Composition that provisions the gateway VM. The only
                  supported value is gcp.
                enum:
                - gcp
                type: string
              responder:
                default: {}
                description: |-
                  Responder configures this Gateway's responder workload (Deployment in Cluster mode,
                  DaemonSet in Local). Every value has a default, so the block may be omitted.
                properties:
                  image:
                    description: |-
                      Image is the responder container image; empty means the operator default
                      (GATEWAY_RESPONDER_IMAGE).
                    type: string
                  port:
                    description: Port is the port the responder listens on and the
                      health DNAT targets; unset means 27000.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  replicas:
                    description: Replicas is the responder Deployment's replica count.
                      Cluster only; unset means 2.
                    format: int32
                    minimum: 1
                    type: integer
                  resources:
                    description: Resources are the responder container's resource
                      requests and limits.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                type: object
              trafficPolicy:
                default: Cluster
                description: |-
                  Cluster masquerades tunnel egress at the VM and DNATs to a Service ClusterIP; Local keeps the
                  client source address and DNATs to a ready pod on the link Lease holder's node. Immutable.
                enum:
                - Cluster
                - Local
                type: string
                x-kubernetes-validations:
                - message: spec.trafficPolicy is immutable
                  rule: self == oldSelf
              wireguard:
                default: {}
                description: |-
                  Wireguard carries the WireGuard tunnel parameters. Every value has a default, so
                  the block may be omitted.
                properties:
                  gatewayAddress:
                    default: 10.99.0.1
                    description: GatewayAddress is the gateway VM's wg0 address (without
                      CIDR suffix).
                    pattern: ^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$
                    type: string
                  keepalive:
                    default: 25
                    description: Keepalive is the link's persistent-keepalive interval
                      in seconds.
                    format: int32
                    type: integer
                  linkAddress:
                    default: 10.99.0.2
                    description: LinkAddress is the link end's wg0 address (without
                      CIDR suffix).
                    pattern: ^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$
                    type: string
                  listenPort:
                    default: 51820
                    description: ListenPort is the gateway VM's WireGuard UDP listen
                      port.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  mtu:
                    default: 1380
                    description: MTU is the link's wg0 MTU.
                    format: int32
                    type: integer
                  reconcileInterval:
                    default: 10s
                    description: ReconcileInterval is how often the link re-reads
                      the XGatewayGCP address.
                    type: string
                  subnet:
                    default: 10.99.0.0/29
                    description: |-
                      Subnet is the tunnel CIDR; its suffix sizes both interface addresses and it
                      is the peer's sole allowed IP range.
                    pattern: ^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])/(3[0-2]|[12]?[0-9])$
                    type: string
                type: object
            required:
            - gcp
            type: object
            x-kubernetes-validations:
            - message: each forward must use a unique port and protocol combination
              rule: '!has(self.forwards) || self.forwards.all(f1, self.forwards.exists_one(f2,
                f2.port == f1.port && f2.protocol == f1.protocol))'
            - message: a UDP forward must not use the WireGuard listen port (spec.wireguard.listenPort)
              rule: '!has(self.forwards) || self.forwards.all(f, !(f.protocol == ''UDP''
                && f.port == self.wireguard.listenPort))'
            - message: spec.link.replicas applies only to trafficPolicy Cluster; Local
                runs a DaemonSet on every eligible node
              rule: self.trafficPolicy != 'Local' || self.link.replicas == 1
            - message: spec.wireguard.subnet, gatewayAddress and linkAddress are immutable
                on a load-balanced Gateway
              rule: '!has(self.gcp.loadBalancer) || (self.wireguard.subnet == oldSelf.wireguard.subnet
                && self.wireguard.gatewayAddress == oldSelf.wireguard.gatewayAddress
                && self.wireguard.linkAddress == oldSelf.wireguard.linkAddress)'
            - message: 'a TCP forward on spec.link.healthPort (27000 when unset) is
                rejected under trafficPolicy Cluster: it is the link''s health port'
              rule: 'self.trafficPolicy == ''Local'' || !has(self.forwards) || self.forwards.all(f,
                !(f.protocol == ''TCP'' && f.port == (has(self.link.healthPort) ?
                self.link.healthPort : 27000)))'
            - message: spec.link.healthPort applies only to trafficPolicy Cluster;
                a Local Gateway's health port is 27000 plus its link id
              rule: self.trafficPolicy != 'Local' || !has(self.link.healthPort)
            - message: spec.responder.replicas applies only to trafficPolicy Cluster;
                Local runs one responder per node
              rule: self.trafficPolicy != 'Local' || !has(self.responder.replicas)
          status:
            properties:
              address:
                description: Address is the gateway VM's public ingress IP, mirrored
                  from the XGatewayGCP.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              gcp:
                description: GCP is the observed state of a Gateway's GCP fleet. Empty
                  on the single-Instance path.
                properties:
                  members:
                    description: |-
                      Members lists the instance group members seen by read-only discovery, keyed and ordered by name
                      and refreshed on every reconcile of a load-balanced Gateway; empty until a member is observed.
                    items:
                      description: |-
                        GatewayGCPMemberStatus is one fleet member's public-only observed state, keyed by
                        instance name. No key material or bundle contents ever appear here.
                      properties:
                        externalAddress:
                          description: ExternalAddress is the last observed public
                            address and is empty until GCP reports one.
                          type: string
                        instanceID:
                          description: InstanceID is the last observed GCP instance
                            ID and is empty until GCP reports one.
                          type: string
                        message:
                          description: Message is empty when there is nothing to report.
                          type: string
                        name:
                          description: Name is the GCP managed instance name.
                          type: string
                        revision:
                          description: Revision is the last path segment of the MIG
                            version's instance template, empty until known.
                          type: string
                        slot:
                          description: Slot is the persistent allocation slot; zero
                            also represents an unallocated pending member.
                          format: int32
                          type: integer
                        state:
                          description: State is derived from the current discovery
                            snapshot and durable member record.
                          type: string
                        tunnelAddress:
                          description: TunnelAddress is the assigned tunnel host address
                            and is empty for pending members.
                          type: string
                        zone:
                          description: Zone is the last observed GCP zone and is empty
                            until discovery reports it.
                          type: string
                      required:
                      - name
                      - state
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                type: object
              link:
                description: Link is the observed state of this Gateway's link workload.
                properties:
                  activeNode:
                    description: |-
                      ActiveNode is the node running the pod that holds the link Lease, in either
                      mode. Empty until a holder pod is observed.
                    type: string
                  id:
                    description: |-
                      Link id allocated in Local mode, 0 in Cluster mode. Never reassigned once written: interface
                      name, nftables table, firewall mark, route table and health port all derive from it.
                    format: int32
                    maximum: 250
                    minimum: 1
                    type: integer
                type: object
              serviceAccountEmail:
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: 'a load-balanced Gateway name is at most 37 characters: the instance
            template name prefix appends a 17-character revision suffix and GCP caps
            the prefix at 54'
          rule: '!has(self.spec) || !has(self.spec.gcp) || !has(self.spec.gcp.loadBalancer)
            || size(self.metadata.name) <= 37'
        - message: 'metadata.name must be a DNS-1035 label of at most 53 characters:
            the responder Service is named <name>-responder'
          rule: size(self.metadata.name) <= 53 && self.metadata.name.matches('^[a-z]([-a-z0-9]*[a-z0-9])?$')
    served: true
    storage: true
    subresources:
      status: {}
