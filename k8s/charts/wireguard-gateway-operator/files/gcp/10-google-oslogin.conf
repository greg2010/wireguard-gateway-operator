# The Flatcar GCE image ships 20-systemd-userdb.conf whose AuthorizedKeysCommand
# shadows the GCE OEM's OS Login drop-in at 60- (sshd keeps the first value
# per keyword). This file sorts before 20- so OS Login keys win.
# GCE-specific: /usr/bin/google_authorized_keys exists only on GCE images.
AuthorizedKeysCommand /usr/bin/google_authorized_keys
AuthorizedKeysCommandUser root
