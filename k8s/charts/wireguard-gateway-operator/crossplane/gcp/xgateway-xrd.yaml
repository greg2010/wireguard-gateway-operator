apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xgatewaygcps.infra.wgnet.dev
spec:
  scope: Namespaced
  group: infra.wgnet.dev
  names:
    kind: XGatewayGCP
    plural: xgatewaygcps
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                region: { type: string }
                zone: { type: string }
                machineType: { type: string }
                image: { type: string }
                diskSizeGB: { type: integer }
                spot: { type: boolean }
                enableOsLogin: { type: boolean }
                userData: { type: string }
                sharedNetworkName: { type: string }
                providerConfigName: { type: string }
                address:
                  type: object
                  properties:
                    type: { type: string }
                    external:
                      type: object
                      properties:
                        name: { type: string }
                        ip: { type: string }
                projectID: { type: string }
                wgListenPort: { type: integer }
                wgMTU: { type: integer }
                wgGatewayAddress: { type: string }
                wgLinkAddress: { type: string }
                wgSubnet: { type: string }
                trafficPolicy: { type: string }
                allowedPorts:
                  type: array
                  items:
                    type: object
                    properties:
                      port: { type: integer }
                      protocol: { type: string }
                    required: [port, protocol]
                serviceAccountId: { type: string }
                secretId: { type: string, minLength: 1 }
                loadBalanced: { type: boolean }
                sessionAffinity: { type: string }
                targetSize: { type: integer }
                zones:
                  type: array
                  items: { type: string }
                templateRevision: { type: string }
                healthPort: { type: integer }
                members:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      slot: { type: integer }
                      tunnelAddress: { type: string }
                      kubernetesSecretName: { type: string }
                      cloudSecretName: { type: string }
                      cloudSecretVersionName: { type: string }
                      cloudSecretIamMemberName: { type: string }
                    required: [name, slot, tunnelAddress, kubernetesSecretName, cloudSecretName, cloudSecretVersionName, cloudSecretIamMemberName]
              required: [region, zone, machineType, sharedNetworkName, wgListenPort, wgMTU, secretId]
            status:
              type: object
              properties:
                address: { type: string }
                serviceAccountEmail: { type: string }
                message: { type: string }
                migName: { type: string }
                instanceName: { type: string }
